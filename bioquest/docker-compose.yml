# Local / small-server deployment:  npm run setup  &&  docker compose up -d --build
# Put a TLS-terminating reverse proxy (Caddy, nginx, Cloudflare Tunnel) in front of "web".
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bioquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run setup first}
    volumes: [dbdata:/var/lib/postgresql/data]
    networks: [internal]           # not published to the host
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d bioquest"], interval: 5s, retries: 10 }

  migrate:
    build: .
    command: node scripts/migrate.js
    env_file: .env
    environment:
      MIGRATE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/bioquest
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bioquest_app:${APP_DB_PASSWORD}@db:5432/bioquest
      UPLOAD_DIR: /data/vault
      MODEL_DIR: /data/models
    ports: ["127.0.0.1:3000:3000"]  # only reachable through your reverse proxy
    volumes: [vault:/data/vault, models:/data/models]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  trainer:
    build: { context: ., dockerfile: ml/Dockerfile }
    restart: unless-stopped
    profiles: ["training"]          # start with: docker compose --profile training up -d
    env_file: .env
    environment:
      WORKER_DATABASE_URL: postgres://bioquest_worker:${WORKER_DB_PASSWORD}@db:5432/bioquest
      UPLOAD_DIR: /data/vault
      MODEL_DIR: /data/models
    volumes: [vault:/data/vault:ro, models:/data/models]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [internal]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes: { dbdata: {}, vault: {}, models: {} }
networks: { internal: {} }
